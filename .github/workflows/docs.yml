name: Manual

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pandoc/actions/setup@v1
        with:
          version: '3.7.0.2'
      - name: Build website and check generated man page
        run: make docs-check
      - name: Verify terminal rendering and staged installation
        run: |
          sudo apt-get update
          sudo apt-get install --yes man-db groff
          stage=$(mktemp -d)
          make install-man PREFIX=/usr/local DESTDIR="$stage"
          MANPATH="$stage/usr/local/share/man" MANPAGER=cat man msg > "$stage/manual.txt"
          test -s "$stage/manual.txt"
          make uninstall-man PREFIX=/usr/local DESTDIR="$stage"
          test ! -e "$stage/usr/local/share/man/man1/msg.1"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy manual
        id: deployment
        uses: actions/deploy-pages@v4

[package]
name = "msg"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Send a message to stdout and Slack from your terminal"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
lto = "thin"
strip = true
